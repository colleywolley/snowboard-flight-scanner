name: 6-Hour Snowboarding Flight Price Scanner

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows manual trigger anytime

jobs:
  scan-flights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 6-Hour Flight Scanner
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 flight_price_scanner.py

      - name: Save Updated Price History
        run: |
          if git status --porcelain | grep -q "price_history.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add price_history.json
            git commit -m "Update flight price history"
            git push
          fi
